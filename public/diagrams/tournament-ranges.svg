<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 429" role="img" aria-labelledby="tournament-ranges-t tournament-ranges-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="tournament-ranges-t">大会の範囲の目安</title>
<desc id="tournament-ranges-d">大会の範囲の目安を、同じ大きさの5つの枠で並べた図です。地域の集まり、市区町村・区、都道府県、ブロック、全国規模。範囲の広さの目安であり、順番や勝ち上がりを表すものではありません。前の範囲の大会に出ていないと次の大会に出られない、という意味ではありません。参加資格は大会ごとに異なります。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="12" y="24" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >大会の範囲の目安</text><text x="12" y="48" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >広さの目安を並べたもので、</text><text x="12" y="68" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >順番ではありません</text><rect x="10" y="84" width="164" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="92" y="117" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" >地域の集まり</text><rect x="186" y="84" width="164" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="268" y="117" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" >市区町村・区</text><rect x="10" y="148" width="164" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="92" y="181" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" >都道府県</text><rect x="186" y="148" width="164" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="268" y="181" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" >ブロック</text><rect x="98" y="212" width="164" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="180" y="245" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" >全国規模</text><rect x="8" y="288" width="344" height="133" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><rect x="20" y="307" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="315" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >範囲の目安です。前の範囲の</text><text x="34" y="336" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >大会に出ていないと次の大会に</text><text x="34" y="357" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >出られない、という意味ではありません。</text><rect x="20" y="378" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="386" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >参加できる人（参加資格）は、</text><text x="34" y="407" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >大会ごとに異なります。</text>
</svg>
