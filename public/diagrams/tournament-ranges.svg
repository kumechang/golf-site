<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="tournament-ranges-t tournament-ranges-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="tournament-ranges-t">大会の範囲の目安</title>
<desc id="tournament-ranges-d">大会の範囲の目安を、同じ大きさの5つの枠で並べた図です。地域の集まり、市区町村・区、都道府県、ブロック、全国規模。範囲の広さの目安であり、順番や勝ち上がりを表すものではありません。前の範囲の大会に出ていないと次に出られる、という意味ではありません。参加資格は大会ごとに異なります。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="20" y="30" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >大会の範囲の目安</text><text x="20" y="58" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >広さの目安を並べたもので、順番ではありません</text><rect x="15" y="78" width="190" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="110" y="118" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" >地域の集まり</text><rect x="225" y="78" width="190" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="320" y="118" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" >市区町村・区</text><rect x="435" y="78" width="190" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="530" y="118" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" >都道府県</text><rect x="120" y="162" width="190" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="215" y="202" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" >ブロック</text><rect x="330" y="162" width="190" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="425" y="202" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" >全国規模</text><rect x="10" y="252" width="620" height="94" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="28" y="277" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >範囲の目安です。前の範囲の大会に出ていないと</text><text x="28" y="301" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >次に出られる、という意味ではありません。</text><text x="28" y="325" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >参加できる人（参加資格）は、大会ごとに異なります。</text>
</svg>
