<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" role="img" aria-labelledby="hole-post-t hole-post-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="hole-post-t">ホールポストの構造</title>
<desc id="hole-post-d">ホールポストを横から見た図です。地面の近くに低い輪（ホール）があり、輪のそばに番号旗のついたポールが立っています。ボールが輪の中で止まった状態を、公式用語でトマリといい、ホールインを意味します。図は構造のイメージで、大きさや高さの数値は示していません。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="20" y="30" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >ホールポストの構造（横から見たイメージ）</text><line x1="20" y1="280" x2="620" y2="280" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="284" x2="22" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="284" x2="52" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="360" y1="284" x2="352" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="390" y1="284" x2="382" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="420" y1="284" x2="412" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="284" x2="442" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="480" y1="284" x2="472" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="510" y1="284" x2="502" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="540" y1="284" x2="532" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="570" y1="284" x2="562" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="600" y1="284" x2="592" y2="294" stroke="#334155" stroke-width="2" stroke-linecap="round"/><ellipse cx="200" cy="278" rx="130" ry="16" fill="#dcfce7" stroke="#15803d" stroke-width="6"/><circle cx="175" cy="270" r="15" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><line x1="330" y1="278" x2="330" y2="70" stroke="#334155" stroke-width="6" stroke-linecap="butt"/><rect x="330" y="70" width="100" height="62" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="380" y="113" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle" >1</text><line x1="430" y1="100" x2="454" y2="100" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="460" y="107" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >番号旗</text><line x1="333" y1="190" x2="366" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="372" y="197" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >ポール</text><line x1="175" y1="254" x2="175" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="175" y="182" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" >ボール</text><line x1="200" y1="296" x2="200" y2="320" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="200" y="346" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" >輪（ホール）：地面に近い低い輪</text><rect x="10" y="372" width="620" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="28" y="404" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >トマリ ＝ ボールが輪の中で止まった状態</text><text x="28" y="432" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >止まるとホールイン（そのホールの終わり）です。</text><text x="20" y="478" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >構造のイメージで、縮尺は正確ではありません。大きさや高さの数値は示していません。</text>
</svg>
