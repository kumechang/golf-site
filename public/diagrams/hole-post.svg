<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="hole-post-t hole-post-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="hole-post-t">ホールポストの構造</title>
<desc id="hole-post-d">ホールポストを横から見た図です。地面の近くに低い輪（ホール）があり、輪のそばに番号旗のついたポールが立っています。ボールが輪の中で止まった状態を、公式用語でトマリといい、ホールインを意味します。図は構造のイメージで、大きさや高さの数値は示していません。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="12" y="24" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >ホールポストの構造</text><text x="12" y="46" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >横から見たイメージ</text><line x1="10" y1="250" x2="350" y2="250" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="205" y1="254" x2="198" y2="263" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="227" y1="254" x2="220" y2="263" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="249" y1="254" x2="242" y2="263" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="271" y1="254" x2="264" y2="263" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="293" y1="254" x2="286" y2="263" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="315" y1="254" x2="308" y2="263" stroke="#334155" stroke-width="2" stroke-linecap="round"/><line x1="337" y1="254" x2="330" y2="263" stroke="#334155" stroke-width="2" stroke-linecap="round"/><ellipse cx="105" cy="248" rx="75" ry="14" fill="#dcfce7" stroke="#15803d" stroke-width="5"/><circle cx="85" cy="240" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><line x1="180" y1="248" x2="180" y2="66" stroke="#334155" stroke-width="5" stroke-linecap="butt"/><rect x="180" y="66" width="68" height="46" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="214" y="98" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle" >1</text><line x1="248" y1="90" x2="268" y2="90" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="274" y="96" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >番号旗</text><line x1="183" y1="175" x2="200" y2="175" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="206" y="181" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >ポール</text><line x1="85" y1="225" x2="85" y2="150" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="85" y="142" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" >ボール</text><line x1="105" y1="266" x2="105" y2="280" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="105" y="300" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" >輪（ホール）</text><text x="105" y="321" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" >地面に近い低い輪</text><rect x="8" y="338" width="344" height="108" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="20" y="366" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >トマリ ＝ ボールが輪の中で</text><text x="20" y="388" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >止まった状態</text><text x="20" y="414" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >止まるとホールイン</text><text x="20" y="434" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >（そのホールの終わり）です。</text><text x="12" y="468" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >構造のイメージで、縮尺は正確ではありません。</text><text x="12" y="488" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >大きさや高さの数値は示していません。</text>
</svg>
