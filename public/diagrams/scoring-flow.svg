<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 616" role="img" aria-labelledby="scoring-flow-t scoring-flow-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="scoring-flow-t">スコアの数え方</title>
<desc id="scoring-flow-d">スコアの数え方を5つの手順で示した図です。1 クラブでボールを打つたびに1打と数える。2 ボールが輪の中で止まるホールイン、トマリで、そのホールの数え方は終わる。数えるときの注意として、3 反則は1打付加、4 から振り、つまり空振りは打数に数えない。5 全ホールの打数を合計し、合計が少ないほうがよい成績とされる。細かな数え方は大会や主催者により異なる場合がある。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="20" y="30" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >スコアの数え方（一例）</text><rect x="84" y="52" width="536" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="44" cy="85" r="20" fill="#15803d" stroke="none" stroke-width="2"/><text x="44" y="92" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="100" y="80" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >1打ごとに数える</text><text x="100" y="105" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >クラブでボールを打つたびに数えます</text><line x1="352" y1="122" x2="352" y2="148" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="84" y="152" width="536" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="44" cy="185" r="20" fill="#15803d" stroke="none" stroke-width="2"/><text x="44" y="192" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="100" y="180" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >輪の中で止まったら、終わり</text><text x="100" y="205" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >ホールイン（トマリ）までの打数を数えます</text><line x1="352" y1="222" x2="352" y2="248" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="10" y="252" width="620" height="190" rx="10" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/><text x="24" y="280" font-size="18" font-weight="700" fill="#334155" text-anchor="start" >数えるときの注意</text><rect x="90" y="294" width="522" height="66" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><circle cx="50" cy="327" r="20" fill="#92400e" stroke="none" stroke-width="2"/><text x="50" y="334" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="106" y="322" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >反則は1打付加</text><text x="106" y="347" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >押し出し・かき寄せなどは、1打が加わります</text><rect x="520" y="308" width="76" height="38" rx="6" fill="#ffffff" stroke="#92400e" stroke-width="3"/><text x="558" y="336" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle" >+1</text><rect x="90" y="372" width="522" height="66" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2" stroke-dasharray="7 5"/><circle cx="50" cy="405" r="20" fill="#92400e" stroke="none" stroke-width="2"/><text x="50" y="412" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="106" y="400" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >から振りは数えない</text><text x="106" y="425" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >ボールに当たらない空振りは、打数に入りません</text><rect x="502" y="386" width="94" height="38" rx="6" fill="#ffffff" stroke="#92400e" stroke-width="3" stroke-dasharray="7 5"/><text x="549" y="411" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" >数えない</text><line x1="352" y1="446" x2="352" y2="472" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="84" y="476" width="536" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="44" cy="509" r="20" fill="#15803d" stroke="none" stroke-width="2"/><text x="44" y="516" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="100" y="504" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >全ホールの打数を合計する</text><text x="100" y="529" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >合計が少ないほうが、よい成績とされます</text><rect x="10" y="560" width="620" height="46" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="28" y="585" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >細かな数え方は、大会や主催者により異なる場合があります。</text>
</svg>
