<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 663" role="img" aria-labelledby="scoring-flow-t scoring-flow-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="scoring-flow-t">スコアの数え方</title>
<desc id="scoring-flow-d">スコアの数え方を3つの手順と2つの注意で示した図です。1 クラブでボールを打つたびに1打と数える。2 ボールが輪の中で止まるホールイン、トマリで、そのホールの数え方は終わる。数えるときの注意として、反則は1打付加、から振り、つまり空振りは打数に数えない。3 全ホールの打数を合計し、合計が少ないほうがよい成績とされる。細かな数え方は大会や主催者により異なる場合がある。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="12" y="24" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >スコアの数え方（一例）</text><rect x="46" y="40" width="306" height="63" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="24" cy="71" r="16" fill="#15803d" stroke="none" stroke-width="2"/><text x="24" y="77" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="58" y="67" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >1打ごとに数える</text><text x="58" y="89" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >クラブでボールを打つたびに数えます</text><line x1="199" y1="106" x2="199" y2="128" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="46" y="131" width="306" height="83" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="24" cy="172" r="16" fill="#15803d" stroke="none" stroke-width="2"/><text x="24" y="178" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="58" y="158" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >輪の中で止まったら終わり</text><text x="58" y="180" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >ホールイン（トマリ）までの</text><text x="58" y="200" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >打数を数えます</text><line x1="199" y1="217" x2="199" y2="239" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="8" y="242" width="344" height="224" rx="10" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/><text x="20" y="267" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >数えるときの注意</text><rect x="52" y="280" width="292" height="83" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><circle cx="30" cy="321" r="16" fill="#92400e" stroke="none" stroke-width="2"/><text x="30" y="327" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >注</text><text x="64" y="307" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >反則は1打付加</text><text x="64" y="329" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >押し出し・かき寄せなどは、</text><text x="64" y="349" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >1打が加わります</text><rect x="282" y="301" width="52" height="40" rx="6" fill="#ffffff" stroke="#92400e" stroke-width="3"/><text x="308" y="329" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle" >+1</text><rect x="52" y="373" width="292" height="83" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="414" r="16" fill="#92400e" stroke="none" stroke-width="2"/><text x="30" y="420" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >注</text><text x="64" y="400" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >から振りは数えない</text><text x="64" y="422" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >ボールに当たらない</text><text x="64" y="442" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >空振りは数えません</text><rect x="258" y="394" width="76" height="40" rx="6" fill="#ffffff" stroke="#92400e" stroke-width="3" stroke-dasharray="7 5"/><text x="296" y="419" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle" >数えない</text><line x1="199" y1="469" x2="199" y2="491" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="46" y="494" width="306" height="83" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="24" cy="535" r="16" fill="#15803d" stroke="none" stroke-width="2"/><text x="24" y="541" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="58" y="521" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >全ホールの打数を合計する</text><text x="58" y="543" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >合計が少ないほうが、</text><text x="58" y="563" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >よい成績とされます</text><rect x="8" y="593" width="344" height="62" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><rect x="20" y="612" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="620" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >細かな数え方は、大会や</text><text x="34" y="641" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >主催者により異なる場合があります。</text>
</svg>
