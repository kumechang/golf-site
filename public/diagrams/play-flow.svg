<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 591" role="img" aria-labelledby="play-flow-t play-flow-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="play-flow-t">プレーの流れ</title>
<desc id="play-flow-d">プレーの流れを4つの手順で示した図です。1 スタートマットから決められた順番で1打目を打つ。2 ボールが止まったら、止まった位置から次を打つ。3 2打目、3打目とくり返す。4 ボールがホールポストの輪の中で止まるとホールイン、公式用語ではトマリ。注意として、打つ順番は決められた順で、ゲーム中の打球練習はできません。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="12" y="24" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >プレーの流れ（一例）</text><rect x="52" y="40" width="268" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="26" cy="71" r="16" fill="#15803d" stroke="none" stroke-width="2"/><text x="26" y="77" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="66" y="67" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >スタートマットから1打目</text><text x="66" y="90" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >決められた順番で打ちます</text><line x1="186" y1="105" x2="186" y2="127" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="52" y="130" width="268" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="26" cy="161" r="16" fill="#15803d" stroke="none" stroke-width="2"/><text x="26" y="167" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="66" y="157" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >ボールが止まる</text><text x="66" y="180" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >止まった位置から次を打ちます</text><line x1="186" y1="195" x2="186" y2="217" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="52" y="220" width="268" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="26" cy="251" r="16" fill="#15803d" stroke="none" stroke-width="2"/><text x="26" y="257" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="66" y="247" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >2打目、3打目…とくり返す</text><text x="66" y="270" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >輪の中で止まるまで続けます</text><line x1="186" y1="285" x2="186" y2="307" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="52" y="310" width="268" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><rect x="57" y="315" width="258" height="52" rx="5" fill="none" stroke="#15803d" stroke-width="2"/><circle cx="26" cy="341" r="16" fill="#15803d" stroke="none" stroke-width="2"/><text x="26" y="347" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="66" y="337" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >ホールイン（トマリ）</text><text x="66" y="360" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >ボールが輪の中で止まった状態</text><path d="M320 268 H340 V234 H324" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="8" y="392" width="344" height="191" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><rect x="20" y="411" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="419" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >打つ順番は、決められた順です。</text><rect x="20" y="440" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="448" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ゲーム中の打球練習はできません。</text><rect x="20" y="469" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="477" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ボールが見つからない・</text><text x="34" y="498" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >コース外に出たときは、</text><text x="34" y="519" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >別の決まりがあります。</text><rect x="20" y="540" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="548" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >進め方の細部は、会場や</text><text x="34" y="569" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >主催者により異なります。</text>
</svg>
