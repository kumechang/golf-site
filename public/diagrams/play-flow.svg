<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 592" role="img" aria-labelledby="play-flow-t play-flow-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="play-flow-t">プレーの流れ</title>
<desc id="play-flow-d">プレーの流れを4つの手順で示した図です。1 スタートマットから決められた順番で1打目を打つ。2 ボールが止まったら、止まった位置から次を打つ。3 2打目、3打目とくり返す。4 ボールがホールポストの輪の中で止まるとホールイン、公式用語ではトマリ。注意として、打つ順番は決められた順で、ゲーム中の打球練習はできません。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="20" y="30" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >プレーの流れ（一例）</text><rect x="84" y="52" width="490" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="44" cy="85" r="20" fill="#15803d" stroke="none" stroke-width="2"/><text x="44" y="92" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="102" y="80" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >スタートマットから1打目</text><text x="102" y="105" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >決められた順番で打ちます</text><line x1="329" y1="122" x2="329" y2="148" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="84" y="152" width="490" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="44" cy="185" r="20" fill="#15803d" stroke="none" stroke-width="2"/><text x="44" y="192" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="102" y="180" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >ボールが止まる</text><text x="102" y="205" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >止まった位置から次を打ちます</text><line x1="329" y1="222" x2="329" y2="248" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="84" y="252" width="490" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="44" cy="285" r="20" fill="#15803d" stroke="none" stroke-width="2"/><text x="44" y="292" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="102" y="280" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >2打目、3打目…とくり返す</text><text x="102" y="305" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >輪の中で止まるまで続けます</text><line x1="329" y1="322" x2="329" y2="348" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="84" y="352" width="490" height="66" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><rect x="89" y="357" width="480" height="56" rx="5" fill="none" stroke="#15803d" stroke-width="2"/><circle cx="44" cy="385" r="20" fill="#15803d" stroke="none" stroke-width="2"/><text x="44" y="392" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="102" y="380" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >ホールイン（トマリ）</text><text x="102" y="405" font-size="16" font-weight="400" fill="#334155" text-anchor="start" >ボールが輪の中で止まった状態</text><path d="M574 304 H604 V266 H578" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="612" y="290" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start" ></text><rect x="10" y="440" width="620" height="142" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="28" y="465" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >打つ順番は、決められた順です。</text><text x="28" y="489" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >ゲーム中の打球練習はできません。</text><text x="28" y="513" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >ボールが見つからない・コース外に出たときは、</text><text x="28" y="537" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >別の決まりがあります。</text><text x="28" y="561" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >進め方の細部は、会場や主催者により異なります。</text>
</svg>
