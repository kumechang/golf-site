<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 534" role="img" aria-labelledby="course-distances-t course-distances-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="course-distances-t">標準コース8ホールの距離のイメージ</title>
<desc id="course-distances-d">標準コースは8ホールで、50m・30m・25m・15mが各2ホールです。横棒の長さを距離に比例させて、50m2本、30m2本、25m2本、15m2本を長い順に並べています。ホールの配置や順路は会場により異なり、この図では描いていません。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="12" y="24" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >標準コース：8ホールの距離</text><text x="12" y="48" font-size="15" font-weight="400" fill="#334155" text-anchor="start" >棒の長さは距離に比例しています</text><rect x="12" y="62" width="320.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="83" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >50m</text><rect x="12" y="96" width="320.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="117" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >50m</text><rect x="12" y="140" width="192.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="161" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >30m</text><rect x="12" y="174" width="192.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="195" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >30m</text><rect x="12" y="218" width="160.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="239" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >25m</text><rect x="12" y="252" width="160.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="273" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >25m</text><rect x="12" y="296" width="96.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="317" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >15m</text><rect x="12" y="330" width="96.0" height="28" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="22" y="351" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" >15m</text><line x1="12" y1="374" x2="332" y2="374" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><line x1="12.0" y1="374" x2="12.0" y2="381" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><text x="12.0" y="398" font-size="14" font-weight="400" fill="#334155" text-anchor="start" >0m</text><line x1="76.0" y1="374" x2="76.0" y2="381" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><text x="76.0" y="398" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >10m</text><line x1="140.0" y1="374" x2="140.0" y2="381" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><text x="140.0" y="398" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >20m</text><line x1="204.0" y1="374" x2="204.0" y2="381" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><text x="204.0" y="398" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >30m</text><line x1="268.0" y1="374" x2="268.0" y2="381" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><text x="268.0" y="398" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >40m</text><line x1="332.0" y1="374" x2="332.0" y2="381" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><text x="332.0" y="398" font-size="14" font-weight="400" fill="#334155" text-anchor="end" >50m</text><rect x="8" y="414" width="344" height="112" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><rect x="20" y="433" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="441" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >50m・30m・25m・15mが</text><text x="34" y="462" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >各2ホール、計8ホール。</text><rect x="20" y="483" width="7" height="7" rx="1" fill="#92400e" stroke="none" stroke-width="0"/><text x="34" y="491" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ホールの配置や順路は、</text><text x="34" y="512" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >会場により異なります。</text>
</svg>
