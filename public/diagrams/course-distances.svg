<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="course-distances-t course-distances-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="course-distances-t">標準コース8ホールの距離のイメージ</title>
<desc id="course-distances-d">標準コースは8ホールで、50m・30m・25m・15mが各2ホールです。横棒の長さを距離に比例させて、50m2本、30m2本、25m2本、15m2本を長い順に並べています。ホールの配置や順路は会場により異なり、この図では描いていません。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
