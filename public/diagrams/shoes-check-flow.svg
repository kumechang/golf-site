<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" role="img" aria-labelledby="shoes-check-flow-t shoes-check-flow-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="shoes-check-flow-t">会場への確認の流れ</title>
<desc id="shoes-check-flow-d">会場や大会の案内に靴の記載があるかで分かれる流れ図です。ある場合は、その案内に従う。ない場合は、主催者や施設の窓口に聞く。JGGAのルールなど、確認した公式ページには靴の規定の記載は見当たりませんでした（2026年11月時点）。</desc>
<defs><marker id="shoes-check-flow-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="8" y="8" width="344" height="40" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="20" y="35" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">会場への確認の流れ</text>
<rect x="8" y="58" width="344" height="86" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<circle cx="34" cy="101" r="16" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="34" y="107" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">?</text>
<text x="62" y="95" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">会場・大会の案内に、</text>
<text x="62" y="119" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">靴の記載がある？</text>
<line x1="92" y1="146" x2="92" y2="236" stroke="#15803d" stroke-width="4" stroke-linecap="round" marker-end="url(#shoes-check-flow-ah)"/>
<line x1="268" y1="146" x2="268" y2="236" stroke="#92400e" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 6" marker-end="url(#shoes-check-flow-ah)"/>
<rect x="56" y="170" width="72" height="34" rx="17" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="92" y="194" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ある</text>
<rect x="232" y="170" width="72" height="34" rx="17" fill="#ffffff" stroke="#92400e" stroke-width="3" stroke-dasharray="6 4"/>
<text x="268" y="194" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ない</text>
<rect x="8" y="244" width="168" height="92" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<text x="20" y="282" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">その案内に</text>
<text x="20" y="306" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">従う</text>
<rect x="184" y="244" width="168" height="92" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="3" stroke-dasharray="8 5"/>
<text x="196" y="274" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">主催者や施設の</text>
<text x="196" y="298" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">窓口に聞く</text>
<rect x="8" y="352" width="344" height="106" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<rect x="20" y="371" width="7" height="7" rx="1" fill="#475569" stroke="none" stroke-width="0"/>
<text x="34" y="379" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start">JGGAのルールなど、確認した</text>
<text x="34" y="401" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start">公式ページには靴の規定の記載は</text>
<text x="34" y="423" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start">見当たりませんでした</text>
<text x="34" y="445" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start">（2026年11月時点）</text>
</svg>
