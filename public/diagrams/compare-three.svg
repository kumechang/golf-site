<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1055" role="img" aria-labelledby="compare-three-t compare-three-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="compare-three-t">グラウンドゴルフ・ゲートボール・パークゴルフの比較</title>
<desc id="compare-three-d">3つの競技を、目的、プレー形式、主な道具、コースで比べた図です。グラウンドゴルフは、ホールポストにボールを入れる打数を競い、個人戦が中心で、クラブ1本とボールを使い、公園・広場・専用コースなどで行います。ゲートボールは、決められたゲートを通過させ最後にゴールポールに当てる競技で、5人1チームの団体戦、専用スティックとボール、専用コートです。パークゴルフは、ホール（穴）にボールを入れる打数を競い、個人戦が中心で、専用クラブとボールを使い、専用のパークゴルフ場で行います。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="12" y="24" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >3つの競技の比較</text><rect x="8" y="38" width="344" height="273" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="3"/><rect x="8" y="38" width="344" height="38" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="20" y="64" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >グラウンドゴルフ</text><line x1="120" y1="166" x2="240" y2="166" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="148" y1="104" x2="172" y2="154" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><rect x="156" y="152" width="28" height="12" rx="3" fill="#0f172a"/><circle cx="192" cy="158" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><ellipse cx="220" cy="163" rx="13" ry="5" fill="none" stroke="#0f172a" stroke-width="3"/><line x1="233" y1="163" x2="233" y2="104" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/><rect x="233" y="104" width="10" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="20" y="188" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >目的</text><text x="78" y="188" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ホールポストにボールを</text><text x="78" y="209" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >入れる打数を競う</text><text x="20" y="236" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >形式</text><text x="78" y="236" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >個人戦が中心</text><text x="20" y="263" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >道具</text><text x="78" y="263" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >クラブ1本＋ボール</text><text x="20" y="290" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >コース</text><text x="78" y="290" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >公園・広場・専用コースなど</text><rect x="8" y="323" width="344" height="294" rx="10" fill="#ffffff" stroke="#92400e" stroke-width="3"/><rect x="8" y="323" width="344" height="38" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="20" y="349" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >ゲートボール</text><line x1="120" y1="451" x2="240" y2="451" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="140" y1="395" x2="164" y2="441" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><line x1="158" y1="441" x2="176" y2="441" stroke="#0f172a" stroke-width="7" stroke-linecap="butt"/><circle cx="190" cy="443" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><path d="M208 451 V411 H236 V451" fill="none" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/><text x="20" y="473" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >目的</text><text x="78" y="473" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >決められたゲートを通過させ、</text><text x="78" y="494" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >最後にゴールポールに当てる</text><text x="20" y="521" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >形式</text><text x="78" y="521" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >5人1チームでの団体戦</text><text x="20" y="548" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >道具</text><text x="78" y="548" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ゲートボール専用スティック</text><text x="78" y="569" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >＋ボール</text><text x="20" y="596" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >コース</text><text x="78" y="596" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >専用コート</text><rect x="8" y="629" width="344" height="294" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="8" y="629" width="344" height="38" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><text x="20" y="655" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >パークゴルフ</text><line x1="120" y1="757" x2="240" y2="757" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="148" y1="695" x2="172" y2="745" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><rect x="156" y="743" width="28" height="12" rx="3" fill="#0f172a"/><circle cx="192" cy="749" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><ellipse cx="224" cy="757" rx="10" ry="4" fill="#0f172a"/><line x1="224" y1="757" x2="224" y2="701" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/><path d="M224 701 l16 7 l-16 7 z" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/><text x="20" y="779" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >目的</text><text x="78" y="779" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ホール（穴）にボールを入れる</text><text x="78" y="800" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >打数を競う</text><text x="20" y="827" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >形式</text><text x="78" y="827" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >個人戦が中心</text><text x="20" y="854" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >道具</text><text x="78" y="854" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >パークゴルフ専用クラブ</text><text x="78" y="875" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >＋ボール</text><text x="20" y="902" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >コース</text><text x="78" y="902" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >専用のパークゴルフ場</text><rect x="8" y="935" width="344" height="112" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/><rect x="20" y="954" width="7" height="7" rx="1" fill="#475569" stroke="none" stroke-width="0"/><text x="34" y="962" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >3つの競技の違いを、絵と</text><text x="34" y="983" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >短い文字にまとめました。</text><rect x="20" y="1004" width="7" height="7" rx="1" fill="#475569" stroke="none" stroke-width="0"/><text x="34" y="1012" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ルールの細部は、各協会や主催者の</text><text x="34" y="1033" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >案内でご確認ください。</text>
</svg>
