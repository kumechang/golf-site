<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 703" role="img" aria-labelledby="compare-three-t compare-three-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="compare-three-t">グラウンドゴルフ・ゲートボール・パークゴルフの比較</title>
<desc id="compare-three-d">3つの競技を、目的、プレー形式、主な道具、コースで比べた図です。グラウンドゴルフは、ホールポストにボールを入れる打数を競い、個人戦が中心で、クラブ1本とボールを使い、公園・広場・専用コースなどで行います。ゲートボールは、決められたゲートを通過させ最後にゴールポールに当てる競技で、5人1チームの団体戦、専用スティックとボール、専用コートです。パークゴルフは、ホール（穴）にボールを入れる打数を競い、個人戦が中心で、専用クラブとボールを使い、専用のパークゴルフ場で行います。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="20" y="30" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >3つの競技の比較</text><rect x="10" y="46" width="620" height="170" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="3"/><rect x="10" y="46" width="620" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="24" y="77" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" >グラウンドゴルフ</text><line x1="20" y1="186" x2="140" y2="186" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="48" y1="124" x2="72" y2="174" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><rect x="56" y="172" width="28" height="12" rx="3" fill="#0f172a"/><circle cx="92" cy="178" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><ellipse cx="120" cy="183" rx="13" ry="5" fill="none" stroke="#0f172a" stroke-width="3"/><line x1="133" y1="183" x2="133" y2="124" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/><rect x="133" y="124" width="10" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="160" y="120" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >目的</text><text x="224" y="120" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >ホールポストにボールを入れる打数を競う</text><text x="160" y="145" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >形式</text><text x="224" y="145" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >個人戦が中心</text><text x="160" y="170" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >道具</text><text x="224" y="170" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >クラブ1本＋ボール</text><text x="160" y="195" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >コース</text><text x="224" y="195" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >公園・広場・専用コースなど</text><rect x="10" y="230" width="620" height="195" rx="10" fill="#ffffff" stroke="#92400e" stroke-width="3"/><rect x="10" y="230" width="620" height="44" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="24" y="261" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" >ゲートボール</text><line x1="20" y1="370" x2="140" y2="370" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="314" x2="64" y2="360" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><line x1="58" y1="360" x2="76" y2="360" stroke="#0f172a" stroke-width="7" stroke-linecap="butt"/><circle cx="90" cy="362" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><path d="M108 370 V330 H136 V370" fill="none" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/><text x="160" y="304" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >目的</text><text x="224" y="304" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >決められたゲートを通過させ、</text><text x="224" y="329" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >最後にゴールポールに当てる</text><text x="160" y="354" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >形式</text><text x="224" y="354" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >5人1チームでの団体戦</text><text x="160" y="379" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >道具</text><text x="224" y="379" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >ゲートボール専用スティック＋ボール</text><text x="160" y="404" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >コース</text><text x="224" y="404" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >専用コート</text><rect x="10" y="439" width="620" height="170" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/><rect x="10" y="439" width="620" height="44" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><text x="24" y="470" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" >パークゴルフ</text><line x1="20" y1="579" x2="140" y2="579" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="48" y1="517" x2="72" y2="567" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><rect x="56" y="565" width="28" height="12" rx="3" fill="#0f172a"/><circle cx="92" cy="571" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><ellipse cx="124" cy="579" rx="10" ry="4" fill="#0f172a"/><line x1="124" y1="579" x2="124" y2="523" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/><path d="M124 523 l16 7 l-16 7 z" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/><text x="160" y="513" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >目的</text><text x="224" y="513" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >ホール（穴）にボールを入れる打数を競う</text><text x="160" y="538" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >形式</text><text x="224" y="538" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >個人戦が中心</text><text x="160" y="563" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >道具</text><text x="224" y="563" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >パークゴルフ専用クラブ＋ボール</text><text x="160" y="588" font-size="16" font-weight="700" fill="#334155" text-anchor="start" >コース</text><text x="224" y="588" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start" >専用のパークゴルフ場</text><rect x="10" y="623" width="620" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="28" y="648" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >3つの競技の違いを、絵と短い文字にまとめました。</text><text x="28" y="672" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >ルールの細部は、各協会や主催者の案内でご確認ください。</text>
</svg>
