<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1073" role="img" aria-labelledby="fouls-t fouls-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="fouls-t">ボールの打ち方のちがい</title>
<desc id="fouls-d">ボールの打ち方の違いを4つの絵で示した図です。ヘッドで正しく打つのは正しい打ち方です。ボールをクラブで押して動かす押し出しと、クラブで引き寄せるかき寄せは反則で、1打が加わります。ボールに当たらなかった空振り、つまりから振りは、打数に数えません。図はイメージです。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="12" y="24" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >打ち方のちがい</text><rect x="8" y="38" width="344" height="226" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="3"/><circle cx="36" cy="66" r="18" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><circle cx="36" cy="66" r="8" fill="none" stroke="#15803d" stroke-width="4"/><text x="62" y="73" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >ヘッドで正しく打つ</text><rect x="58" y="92" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="66" y1="164" x2="294" y2="164" stroke="#334155" stroke-width="3" stroke-linecap="round"/><rect x="108" y="142" width="26" height="22" rx="3" fill="#0f172a"/><line x1="114" y1="142" x2="142" y2="102" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="154" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><line x1="166" y1="154" x2="226" y2="154" stroke="#15803d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/><circle cx="254" cy="154" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 4"/><text x="180" y="189" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >ヘッドで打つ</text><text x="20" y="222" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >クラブのヘッド（先の部分）で</text><text x="20" y="244" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ボールを打ちます。</text><rect x="8" y="274" width="344" height="226" rx="10" fill="#ffffff" stroke="#92400e" stroke-width="3"/><circle cx="36" cy="302" r="18" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><line x1="29" y1="295" x2="43" y2="309" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><line x1="29" y1="309" x2="43" y2="295" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><text x="62" y="309" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >押し出し</text><rect x="58" y="328" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="66" y1="400" x2="294" y2="400" stroke="#334155" stroke-width="3" stroke-linecap="round"/><rect x="98" y="378" width="26" height="22" rx="3" fill="#0f172a"/><line x1="104" y1="378" x2="132" y2="338" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><circle cx="140" cy="390" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><circle cx="208" cy="390" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 4"/><line x1="158" y1="360" x2="248" y2="360" stroke="#92400e" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/><text x="180" y="425" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >押しつづける</text><text x="20" y="458" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ボールをクラブで押して動かすこと。</text><text x="20" y="480" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >反則で、1打が加わります。</text><rect x="8" y="510" width="344" height="226" rx="10" fill="#ffffff" stroke="#92400e" stroke-width="3"/><circle cx="36" cy="538" r="18" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><line x1="29" y1="531" x2="43" y2="545" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><line x1="29" y1="545" x2="43" y2="531" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><text x="62" y="545" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >かき寄せ</text><rect x="58" y="564" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="66" y1="636" x2="294" y2="636" stroke="#334155" stroke-width="3" stroke-linecap="round"/><circle cx="158" cy="626" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><rect x="178" y="614" width="26" height="22" rx="3" fill="#0f172a"/><line x1="198" y1="614" x2="226" y2="574" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><line x1="268" y1="596" x2="188" y2="596" stroke="#92400e" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/><circle cx="102" cy="626" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 4"/><text x="180" y="661" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >引き寄せる</text><text x="20" y="694" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ボールをクラブで引き寄せること。</text><text x="20" y="716" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >反則で、1打が加わります。</text><rect x="8" y="746" width="344" height="226" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3" stroke-dasharray="8 5"/><circle cx="36" cy="774" r="18" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><line x1="28" y1="774" x2="44" y2="774" stroke="#334155" stroke-width="4" stroke-linecap="round"/><text x="62" y="781" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" >から振り（空振り）</text><rect x="58" y="800" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="66" y1="872" x2="294" y2="872" stroke="#334155" stroke-width="3" stroke-linecap="round"/><circle cx="178" cy="862" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><path d="M108 820 Q178 842 248 820" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah2)"/><rect x="164" y="824" width="28" height="12" rx="3" fill="#0f172a"/><line x1="180" y1="824" x2="208" y2="806" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><text x="180" y="897" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >ボールに当たらない</text><text x="20" y="930" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >ボールに当たらなかった空振り。</text><text x="20" y="952" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >打数に数えません。</text><rect x="8" y="982" width="344" height="83" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/><rect x="20" y="1001" width="7" height="7" rx="1" fill="#475569" stroke="none" stroke-width="0"/><text x="34" y="1009" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >図はイメージです。</text><text x="34" y="1030" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >細かな扱いは、大会や主催者により</text><text x="34" y="1051" font-size="15" font-weight="400" fill="#0f172a" text-anchor="start" >異なる場合があります。</text>
</svg>
