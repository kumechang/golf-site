<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" role="img" aria-labelledby="fouls-t fouls-d" font-family='"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif'>
<title id="fouls-t">ボールの打ち方のちがい</title>
<desc id="fouls-d">ボールの打ち方の違いを4つの絵で示した図です。ヘッドで正しく打つのは正しい打ち方です。ボールをクラブで押して動かす押し出しと、クラブで引き寄せるかき寄せは反則で、1打が加わります。ボールに当たらなかった空振り、つまりから振りは、打数に数えません。図はイメージです。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="20" y="30" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >打ち方のちがい</text><rect x="10" y="46" width="620" height="124" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="3"/><rect x="20" y="56" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="28" y1="128" x2="256" y2="128" stroke="#334155" stroke-width="3" stroke-linecap="round"/><rect x="70" y="106" width="26" height="22" rx="3" fill="#0f172a"/><line x1="76" y1="106" x2="104" y2="66" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><circle cx="112" cy="118" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><line x1="128" y1="118" x2="188" y2="118" stroke="#15803d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/><circle cx="216" cy="118" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 4"/><text x="142" y="153" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >ひと振りで打つ</text><circle cx="300" cy="80" r="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><circle cx="300" cy="80" r="9" fill="none" stroke="#15803d" stroke-width="4"/><text x="334" y="88" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >ヘッドで正しく打つ</text><text x="290" y="124" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >クラブのヘッド（先の部分）で</text><text x="290" y="148" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >ボールを打ちます。</text><rect x="10" y="182" width="620" height="124" rx="10" fill="#ffffff" stroke="#92400e" stroke-width="3"/><rect x="20" y="192" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="28" y1="264" x2="256" y2="264" stroke="#334155" stroke-width="3" stroke-linecap="round"/><rect x="60" y="242" width="26" height="22" rx="3" fill="#0f172a"/><line x1="66" y1="242" x2="94" y2="202" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><circle cx="102" cy="254" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><circle cx="170" cy="254" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 4"/><line x1="120" y1="224" x2="210" y2="224" stroke="#92400e" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/><text x="142" y="289" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >押しつづける</text><circle cx="300" cy="216" r="20" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><line x1="292" y1="208" x2="308" y2="224" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><line x1="292" y1="224" x2="308" y2="208" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><text x="334" y="224" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >押し出し</text><text x="290" y="260" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >ボールをクラブで押して動かすこと。</text><text x="290" y="284" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >反則で、1打が加わります。</text><rect x="10" y="318" width="620" height="124" rx="10" fill="#ffffff" stroke="#92400e" stroke-width="3"/><rect x="20" y="328" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="28" y1="400" x2="256" y2="400" stroke="#334155" stroke-width="3" stroke-linecap="round"/><circle cx="120" cy="390" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><rect x="140" y="378" width="26" height="22" rx="3" fill="#0f172a"/><line x1="160" y1="378" x2="188" y2="338" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><line x1="230" y1="360" x2="150" y2="360" stroke="#92400e" stroke-width="4" stroke-linecap="round" marker-end="url(#ah2)"/><circle cx="64" cy="390" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 4"/><text x="142" y="425" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >引き寄せる</text><circle cx="300" cy="352" r="20" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><line x1="292" y1="344" x2="308" y2="360" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><line x1="292" y1="360" x2="308" y2="344" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><text x="334" y="360" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >かき寄せ</text><text x="290" y="396" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >ボールをクラブで引き寄せること。</text><text x="290" y="420" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >反則で、1打が加わります。</text><rect x="10" y="454" width="620" height="124" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3" stroke-dasharray="8 5"/><rect x="20" y="464" width="244" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><line x1="28" y1="536" x2="256" y2="536" stroke="#334155" stroke-width="3" stroke-linecap="round"/><circle cx="140" cy="526" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><path d="M70 484 Q140 506 210 484" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah2)"/><rect x="126" y="488" width="28" height="12" rx="3" fill="#0f172a"/><line x1="142" y1="488" x2="170" y2="470" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/><text x="142" y="561" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" >ボールに当たらない</text><circle cx="300" cy="488" r="20" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><line x1="291" y1="488" x2="309" y2="488" stroke="#334155" stroke-width="4" stroke-linecap="round"/><text x="334" y="496" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" >から振り（空振り）</text><text x="290" y="532" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >ボールに当たらなかった空振り。</text><text x="290" y="556" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >打数に数えません。</text><rect x="10" y="590" width="620" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="28" y="615" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >図はイメージです。細かな扱いは、大会や主催者により</text><text x="28" y="639" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start" >異なる場合があります。</text>
</svg>
